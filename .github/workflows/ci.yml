name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --dev
      - name: Mypy
        run: uv run mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # M7 wave A: these give tests/server's DB-backed tests (models CRUD,
    # constraints, `alembic upgrade head` from an empty DB) a real
    # Postgres/Redis to run against instead of skipping, per
    # RAGLEDGER_TEST_DATABASE_URL/REDIS_URL below. Standard ports, since
    # a GitHub-hosted runner has nothing else bound to them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ragledger
          POSTGRES_PASSWORD: ragledger
          POSTGRES_DB: ragledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAGLEDGER_TEST_DATABASE_URL: postgresql+psycopg://ragledger:ragledger@localhost:5432/ragledger
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests with coverage
        run: uv run pytest --cov=ragledger --cov-report=term-missing --cov-report=xml
