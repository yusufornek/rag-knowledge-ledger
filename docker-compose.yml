# Local integration testing only. This file is not started as part of
# the standard development setup (see README.md). It is intended for
# developers who are working on the Qdrant or pgvector connectors and
# need real, disposable local instances to test against.
#
# Host ports are intentionally non-default (26333, 25432) to avoid
# clashing with any Qdrant or Postgres instance already running on the
# developer's machine.
name: ragledger-dev

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "26333:6333"
    volumes:
      - ragledger-dev-qdrant:/qdrant/storage

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragledger
      # Insecure default for local development only. Do not use this
      # value, or this compose file, in any shared or production
      # environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragledger-dev-only-insecure}
      POSTGRES_DB: ragledger
    ports:
      - "25432:5432"
    volumes:
      - ragledger-dev-postgres:/var/lib/postgresql/data

  # M7 wave A: the server's own persistence database (workspaces, api
  # tokens, sources, builds, manifests, targets, snapshots,
  # reconciliations, findings, policies, audit events, jobs -- see
  # ragledger/server/db/models/). This is a separate database from
  # `postgres` above, which is only ever a *target* the reconciliation
  # connectors read from in integration tests, never the server's own
  # store. Host port (25433) and default credentials match
  # ragledger.server.settings.Settings' development default
  # DATABASE_URL and tests/server's RAGLEDGER_TEST_DATABASE_URL
  # default, so `docker compose up appdb` plus an unmodified
  # environment "just works" for local server development.
  appdb:
    image: postgres:16
    environment:
      POSTGRES_USER: ragledger
      # Insecure default for local development only. Do not use this
      # value, or this compose file, in any shared or production
      # environment.
      POSTGRES_PASSWORD: ${APPDB_PASSWORD:-ragledger}
      POSTGRES_DB: ragledger
    ports:
      - "25433:5432"
    volumes:
      - ragledger-dev-appdb:/var/lib/postgresql/data

  # M7 wave A: the Dramatiq job broker (section 21) and, later, request
  # session storage. Not yet consumed by any wave A code path beyond
  # ragledger.server.app's best-effort /healthz check.
  redis:
    image: redis:7
    ports:
      - "26379:6379"
    volumes:
      - ragledger-dev-redis:/data

volumes:
  ragledger-dev-qdrant:
  ragledger-dev-postgres:
  ragledger-dev-appdb:
  ragledger-dev-redis:
