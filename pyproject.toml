[project]
name = "ragledger"
version = "0.1.1"
description = "Lineage and integrity ledger for retrieval-augmented generation knowledge bases"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "RAG Knowledge Ledger contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "typer>=0.12",
    "pyyaml>=6",
    "cryptography>=42",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "zstandard>=0.22",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "redis>=5.0",
]

[project.urls]
Homepage = "https://github.com/ragledger/rag-knowledge-ledger"
Issues = "https://github.com/ragledger/rag-knowledge-ledger/issues"

[project.scripts]
ragledger = "ragledger.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragledger"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ragledger --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ragledger"]
